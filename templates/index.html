<!DOCTYPE html>
<html>
<head>
    <title>Real-Time Translator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="container">
    <h1>🌍 Real-Time Language Translator</h1>

    <select id="language">
        <option value="hi">Hindi</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="ar">Arabic</option>
    </select>

    <button onclick="startTranslation()">🎤 Speak</button>

    <h3>Original:</h3>
    <p id="original"></p>

    <h3>Translated:</h3>
    <p id="translated"></p>

    <audio id="audioPlayer" controls></audio>
</div>

<script>
function startTranslation() {
    let lang = document.getElementById("language").value;

    fetch("/translate", {
        method: "POST",
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: "language=" + lang
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("original").innerText = data.original;
        document.getElementById("translated").innerText = data.translated;

        let player = document.getElementById("audioPlayer");
        player.src = data.audio;
        player.play();
    });
}
</script>

</body>
</html>
